    win26TierLabels: { grand: 'Grand Prize', second: 'Second Prize', third: 'Third Prize', merit: 'Honorable Mention', gh1: 'Taiwan Panorama Special Award \u2014 First', gh2: 'Taiwan Panorama Special Award \u2014 Second', gh3: 'Taiwan Panorama Special Award \u2014 Third' },
    win26TierShort: { grand: 'Grand Prize', second: 'Second Prize', third: 'Third Prize', merit: 'Honorable Mention', gh1: 'Panorama 1st', gh2: 'Panorama 2nd', gh3: 'Panorama 3rd' },
  },
};

function langFromUrl() {
  try { if ((new URLSearchParams(location.search).get('lang') || '').toLowerCase() === 'en') return 'en'; } catch (e) {}
  return 'zh';
}
let currentLang = langFromUrl();

function txt(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

// 得獎作品劇照 — Drive 縮圖
function winnerStill(id) { return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w800'; }

// 先把 13 張劇照抓進快取再鋪牌，不然會變成「輪轉進來才開始載圖」。抓太久就直接開跑。
let win26StillsReady = false, win26Build = 0;
function preloadWinnerStills(done) {
  if (win26StillsReady) { done(); return; }
  let pending = WINNERS_2026.length, settled = false;
  const finish = () => {
    if (settled) return;
    settled = true; clearTimeout(timer); win26StillsReady = true; done();
  };
  const timer = setTimeout(finish, 3000);
  WINNERS_2026.forEach((w) => {
    const im = new Image();
    im.referrerPolicy = 'no-referrer';
    const tick = () => { if (--pending <= 0) finish(); };
    im.onload = tick;
    im.onerror = tick;
    im.src = winnerStill(w.still);
  });
}

// 一張得獎卡：獎項標籤在圖上方、劇照保留原始比例（固定高度、寬度隨比例）、片名與創作者在圖片外
// 冠亞季軍的裝飾圖示：首獎珊瑚色皇冠加一顆小星芒、貳獎皇冠、參獎星星
const W26_CREST = { grand: ['crown', 'spark'], second: ['crown'], third: ['star'] };
const W26_ICON = {
  crown: '<svg class="ic-crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l3.7 5.6L21.2 5.6 19.4 18H4.6L2.8 5.6 8.3 9.2z"/></svg>',
  star:  '<svg class="ic-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"/></svg>',
  spark: '<svg class="ic-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.9 6.3 4.8 10.2 12 12-7.2 1.8-11.1 5.7-12 12-.9-6.3-4.8-10.2-12-12C7.2 10.2 11.1 6.3 12 0z"/></svg>',
};

function makeWinnerCard26(w, t, withChip) {
  const card = document.createElement('a');
  card.className = 'w26-card';
  card.href = w.url; card.target = '_blank'; card.rel = 'noopener noreferrer';
  card.setAttribute('aria-label', t.win26TierLabels[w.tier] + '：' + w.title + ' — ' + w.creator);

  const chip = document.createElement('span');
  chip.className = 'w26-chip';
  // 中文版標籤併排中英文，英文版只留英文
  const short = t.win26TierShort[w.tier];
  chip.textContent = currentLang === 'en' ? short : short + ' / ' + C.en.win26TierShort[w.tier].toUpperCase();

  const fig = document.createElement('span');
  fig.className = 'w26-fig';
  const img = document.createElement('img');
  img.alt = w.title; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.onerror = () => { img.remove(); }; // 抓不到就留深藍底
  img.src = winnerStill(w.still);
  fig.appendChild(img);

  const cap = document.createElement('span');
  cap.className = 'w26-cap';
  const capText = document.createElement('span');
  capText.className = 'w26-captext';
  const name = document.createElement('span'); name.className = 'w26-cname'; name.textContent = w.title;
  const by = document.createElement('span'); by.className = 'w26-ccreator'; by.textContent = w.creator;
  capText.appendChild(name); capText.appendChild(by);
  const play = document.createElement('span'); play.className = 'w26-play';
  cap.appendChild(capText); cap.appendChild(play);

  if (withChip) card.appendChild(chip);
  card.appendChild(fig); card.appendChild(cap);
  return card;
}

// 2026 得獎作品輪轉牆 — 同一組連放兩次配合 -50% 位移接回原點，動法與 2025 那面牆一致
function renderWinners2026() {
  const t = C[currentLang];
  const reel = document.getElementById('win26-reel');
  if (!reel) return;

  txt('win26-kicker', t.win26Kicker);
  txt('win26-headline', t.win26Headline);
  txt('win26-sub', t.win26Sub);
  const headline = document.getElementById('win26-headline');
  if (headline) {
    const star = (cls) => '<svg class="w26-spark ' + cls + '" viewBox="0 0 24 24" aria-hidden="true">'
      + '<path d="M12 0c.9 6.3 4.8 10.2 12 12-7.2 1.8-11.1 5.7-12 12-.9-6.3-4.8-10.2-12-12C7.2 10.2 11.1 6.3 12 0z"/></svg>';
    headline.insertAdjacentHTML('beforeend',
      '<span class="w26-sparks" aria-hidden="true">' + star('s1') + star('s2') + star('s3') + '</span>');
  }
  txt('win26-side-body', t.win26SideBody);
  txt('win26-side-btn', t.win26SideBtn + ' \u2197');
  txt('win26-hint', t.win26Hint);
  txt('win26-rest-title', t.win26RestTitle);
  txt('win26-rest-count', t.win26RestCount);

  const build = ++win26Build;
  preloadWinnerStills(() => {
    if (build !== win26Build) return; // 期間又切過語言就放掉這次

    // 前三名：每個獎項自成一層，徽記與獎項名當層標題，一層比一層小
    const podium = document.getElementById('win26-podium');
    if (podium) {
      podium.innerHTML = '';
      ['grand', 'second', 'third'].forEach((tier) => {
        const films = WINNERS_2026.filter(w => w.tier === tier);
        if (!films.length) return;
        const block = document.createElement('div');
        block.className = 'w26-tier t-' + tier;
        const head = document.createElement('div');
        head.className = 'w26-tierhead';
        head.innerHTML =
          '<div class="w26-crest t-' + tier + '" aria-hidden="true">' + W26_CREST[tier].map(k => W26_ICON[k]).join('') + '</div>' +
          '<h3 class="w26-tiername"></h3><div class="w26-tiersub"></div>';
        head.querySelector('.w26-tiername').textContent = t.win26TierShort[tier];
        // 中文版底下補英文；英文版就不重複一次
        head.querySelector('.w26-tiersub').textContent = currentLang === 'en' ? '' : C.en.win26TierShort[tier];
        const row = document.createElement('div');
        row.className = 'w26-row';
        films.forEach(w => row.appendChild(makeWinnerCard26(w, t, false)));
        block.appendChild(head); block.appendChild(row);
        podium.appendChild(block);
      });
    }

    // 其餘得獎作品：小一號的卡片，維持自動輪轉
    reel.innerHTML = '';
    const rest = WINNERS_2026.filter(w => ['merit', 'gh1', 'gh2', 'gh3'].indexOf(w.tier) >= 0);
    const track = document.createElement('div');
    track.className = 'w26-track';
    for (let pass = 0; pass < 2; pass++) {
      rest.forEach((w) => {
        const card = makeWinnerCard26(w, t, true);
        if (pass === 1) card.setAttribute('aria-hidden', 'true'); // 第二份只是為了接圖，不重複報讀
        track.appendChild(card);
      });
    }
    reel.appendChild(track);
    (function () { // 內距與間距不一致時 -50% 每圈會小跳一下，改用實測的一輪距離
      const cards = track.children, setLen = rest.length;
      const apply = () => {
        if (cards.length <= setLen) return;
        const period = cards[setLen].offsetLeft - cards[0].offsetLeft;
        if (period) track.style.setProperty('--w26-period', period + 'px');
      };
      apply();
      let t = null;
      window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(apply, 180); });
    })();
    requestAnimationFrame(() => track.classList.add('is-ready'));

    // 桌機滑過暫停；手機按住暫停、放開接著轉，也能直接左右滑
    enableReelInteraction(reel, track, () => ({
      start: 0,
      period: parseFloat(track.style.getPropertyValue('--w26-period')) || 0,
    }), 78);
  });
}



// 輪轉牆的互動 —— 桌機滑過暫停；手機「按住才停、放開就接著轉」，而且可以直接左右滑動帶動它。
//   measure() 要回傳 { start, period }（px）：跑馬燈從 start 走到 start - period 剛好接回原點。
//   duration 是 CSS 上那段動畫的秒數，放開手指時用負的 animation-delay 從當下位置接續，不會跳格。
function enableReelInteraction(viewport, track, measure, duration) {
  const fine = !window.matchMedia || window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (fine) {
    // 真的有游標才綁 hover；手機點一下也會補發 mouseenter，綁了會永遠停住
    viewport.addEventListener('mouseenter', () => track.classList.add('paused'));
    viewport.addEventListener('mouseleave', () => track.classList.remove('paused'));
    return;
  }

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let from = 0, span = 0, base = 0, startX = 0, startY = 0, dx = 0, mode = null, swiped = false;

  // 讀出動畫跑到哪裡（computed transform 會給當下那一格的矩陣）
  const currentX = () => {
    const tr = getComputedStyle(track).transform;
    if (!tr || tr === 'none') return from;
    const n = tr.match(/-?[\d.]+/g);
    if (!n) return from;
    return parseFloat(n.length >= 16 ? n[12] : n[4]) || 0;
  };
  // 位移折回 [start - period, start]，兩份卡片才接得起來、怎麼滑都不會滑到空白
  const wrap = (x) => { if (!span) return x; const o = (((from - x) % span) + span) % span; return from - o; };

  const settle = () => {
    const x = wrap(base + dx);
    if (reduce || !span) { track.style.transform = 'translateX(' + x + 'px)'; track.classList.remove('is-dragging'); return; }
    track.style.transform = '';
    track.style.animationDelay = (-((from - x) / span) * duration) + 's';
    track.classList.remove('is-dragging');
  };

  // 滑過之後的那一下 click 不算點選，不然滑一滑就被帶去別的分頁
  track.addEventListener('click', (e) => {
    if (!swiped) return;
    swiped = false; e.preventDefault(); e.stopPropagation();
  }, true);

  viewport.addEventListener('touchstart', (e) => {
    const g = measure() || {};
    from = g.start || 0; span = g.period || 0;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dx = 0; mode = 'hold'; swiped = false;
    base = currentX();
    track.style.animationDelay = '';
    track.style.transform = 'translateX(' + base + 'px)';
    track.classList.add('is-dragging');
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (!mode) return;
    const mx = e.touches[0].clientX - startX, my = e.touches[0].clientY - startY;
    if (mode === 'hold') {
      if (Math.abs(my) > Math.abs(mx) && Math.abs(my) > 10) { mode = null; settle(); return; } // 直向：讓給頁面捲動
      if (Math.abs(mx) > 6) { mode = 'drag'; swiped = true; } else return;
    }
    dx = mx;
    track.style.transform = 'translateX(' + wrap(base + dx) + 'px)';
  }, { passive: true });

  const release = () => { if (!mode) return; mode = null; settle(); };
  viewport.addEventListener('touchend', release);
  viewport.addEventListener('touchcancel', release);
}

function render() {
  const t = C[currentLang];
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-TW';
  txt('wp-back', t.back);
  txt('wp-foot-org', t.footOrg);
  txt('wp-foot-link', t.footLink);
  document.getElementById('wp-en').classList.toggle('on', currentLang === 'en');
  document.getElementById('wp-zh').classList.toggle('on', currentLang !== 'en');
  renderWinners2026();
}

function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  render();
  try { history.pushState({ lang }, '', lang === 'en' ? '/winners?lang=en' : '/winners'); } catch (e) {}
}
window.addEventListener('popstate', () => {
  const l = langFromUrl();
  if (l !== currentLang) { currentLang = l; render(); }
});

render();

// 進場動畫播完（約 4 秒）就淡出並解鎖捲動；點一下或按任意鍵可以跳過
(function teardownIntro() {
  const overlay = document.getElementById('wi-overlay');
  const unlock = () => document.documentElement.classList.remove('intro-lock');
  if (!overlay) { unlock(); return; }
  txt('wi-skip', C[currentLang].skip);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let done = false;
  const dismiss = () => {
    if (done) return;
    done = true;
    overlay.classList.add('is-out');
    unlock();
    window.scrollTo(0, 0);
    setTimeout(() => overlay.remove(), 600);
  };
  window.scrollTo(0, 0);
  overlay.addEventListener('click', dismiss);
  window.addEventListener('keydown', dismiss, { once: true });
  setTimeout(dismiss, reduce ? 0 : 4300);
})();

// 捲出畫面就讓輪轉停下來，省效能
if ('IntersectionObserver' in window) {
  const reel = document.getElementById('win26-reel');
  if (reel) new IntersectionObserver((entries) => {
    entries.forEach(e => {
      const track = reel.querySelector('.w26-track');
      if (track) track.style.animationPlayState = e.isIntersecting ? '' : 'paused';
    });
  }, { rootMargin: '120px 0px' }).observe(reel);
}
</script>
<script src="../assets/winners-intro/winners-intro.js"></script>
